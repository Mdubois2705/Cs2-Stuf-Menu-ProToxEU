// =====================================================
//  CS2 PRACTICE - à exécuter en entraînement local
//  Dans la console : exec cs2_practice
// =====================================================

sv_cheats true

// ---------- Mode / partie ----------
game_alias casual
mp_autoteambalance false
mp_limitteams 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_roundtime_hostage 60
mp_freezetime 0
mp_team_intro_time 0
mp_respawn_on_death_ct true
mp_respawn_on_death_t true
mp_autokick false
mp_warmup_end

// ---------- Économie ----------
mp_maxmoney 99999
mp_startmoney 99999
mp_buytime 3600
mp_buy_anywhere 1

// ---------- Entraînement ----------
sv_showimpacts 3
sv_infinite_ammo 1
sv_regeneration_force_on true
sv_grenade_trajectory_prac_pipreview true
sv_grenade_trajectory_prac_trailtime 6
sv_grenade_trajectory_time_spectator 3
ammo_grenade_limit_total 5

// ---------- Bots ----------
bot_kick
bot_stop 1
ff_damage_reduction_bullets 1
ff_damage_reduction_grenade 1
ff_damage_reduction_other 1

// ---------- Alias ----------
alias giveall "give weapon_ak47; give weapon_awp; give weapon_deagle; give weapon_hegrenade; give weapon_flashbang; give weapon_smokegrenade; give weapon_molotov"
alias killsmoke "ent_fire smokegrenade_projectile kill; stopsound"

// ---------- Binds ----------
bind "k" "sv_rethrow_last_grenade"
bind "n" "noclip"
bind "l" "killsmoke"
bind "p" "giveall"

echo "cs2_practice.cfg chargé"
