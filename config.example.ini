; Copié automatiquement en config.ini au premier lancement (config.ini n'est pas versionné).
; CfgPath est détecté automatiquement au premier lancement.

[Settings]
; Dossier cfg de CS2 (où est copié cs2_practice.cfg ; console.log est cherché à côté)
; Laisse vide : le script le trouve tout seul au premier lancement
CfgPath=
; Une seule touche globale en jeu : elle ouvre le menu principal (syntaxe AutoHotkey : F1, Insert, XButton1, ^F1...)
MenuKey=F1
; Touches actives seulement dans le menu des stuffs
FavKey=F2
; Cadenas : verrouille/déverrouille la catégorie ou le stuff sélectionné (empêche la suppression)
LockKey=F3
; Créer un nouveau stuff (menu des stuffs ouvert)
AddKey=F4
; 1 = vérifie au lancement s'il existe une nouvelle version sur GitHub (propose de l'installer), 0 = désactivé
AutoUpdate=1
; 1 = vérifie l'installation au lancement (dossiers, cfg, console.log), puis teste la connexion directe et l'envoi de commandes une fois CS2 lancé
AutoCheck=1
; 1 = copie tes maps une fois par jour dans data\backup\auto (restaurable depuis « Profils et partage »)
AutoBackup=1
; Nombre de jours de sauvegardes conservées
BackupKeep=14
; Connexion directe à la console de CS2 : port TCP local ouvert par l'option de lancement -netconport.
; C'est le seul moyen d'envoyer des commandes au jeu : le menu doit être lancé AVANT CS2, il démarre le jeu lui-même.
NetconPort=2121
; Options données à CS2 par le menu ({port} est remplacé par NetconPort). Tes options Steam ne sont pas modifiées.
; ATTENTION : -insecure désactive VAC (pas de matchmaking, Premier ni FACEIT dans cette session).
LaunchArgs=-condebug -netconport {port} -insecure
; Décalage de hauteur appliqué à chaque téléportation (setpos). getpos renvoie la hauteur
; des yeux, setpos place les pieds : -64 évite d'apparaître trop haut / dans le plafond.
; Mets 0 pour désactiver, ou ajuste (ex. -60) si tu es encore trop haut ou trop bas.
TpZOffset=-64
; Captures d'écran des stuffs (Shot=0 pour désactiver)
Shot=1
ShotSize=100
ShotZoom=160
; Placement de la capture : 1 = coin supérieur droit, 2 = libre (ShotX, ShotY)
ShotPos=1
; Arrondi des coins de la capture (px)
ShotCorner=3
ShotX=520
ShotY=100
; Coordonnées en temps réel dans le coin inférieur gauche (activées dans « Réglages du menu », onglet Coords)
; Fréquence de mise à jour en millisecondes (minimum 100)
HudInterval=120
; 1 = afficher les coordonnées dès le lancement du script
HudAtStart=0
HudAuto=1
HudX=12
HudY=900
; 1 = fenêtre d'accueil (launcher) au démarrage, 0 = le menu lance CS2 directement
Launcher=1
; Touches à l'écran (Maj, Ctrl, Espace, ZQSD, souris) : 1 = affichées, taille 60 a 200 (%), opacité 80 a 255, KeysAuto=1 = coin inférieur droit
KeysOn=0
KeysHideOut=0
; Petits sons du menu (défilement, avancer, reculer) : 1 = activés, volume 10 a 100
MenuSound=1
MenuSoundVol=25
; Quiz : touches (noms AutoHotkey : PgDn, F6, XButton1...), pas de répétition, capture dans l'aide, mode (all = tous les stuffs, pick = stuffs choisis)
QuizKeyNext=PgDn
QuizKeyPrev=PgUp
QuizKeyHint=Home
QuizKeyAns=End
QuizKeyZone=Insert
QuizZoneOn=1
QuizZoneSize=140
QuizFovPct=100
QuizScoreOn=1
QuizTol=5
QuizNoRepeat=1
QuizHintShot=1
QuizMode=all
TimerHideOut=0
; 1 = reprendre les touches enregistrées dans CS2 (marche, accroupi, saut, déplacement)
KeysFromGame=1
KeysSize=100
KeysOpacity=220
KeysAuto=1
KeysX=1500
KeysY=900
; Map chargée toute seule après « Lancer CS2 » : last (dernière jouée), none (aucune) ou un nom de map (ex : de_mirage)
AutoMap=last
; Secondes d'attente après la connexion au jeu avant de charger la map
AutoMapDelay=8
; Réservé à l'auteur : 1 = bouton de publication des packs, PackRepoDir = dossier Git du menu
PackAdmin=0
PackRepoDir=
; 1 = affiche la fenêtre « Nouveautés » (CHANGELOG) au démarrage après une mise à jour, 0 = désactivé
ShowChangelog=1
; Touche liée à sv_rethrow_last_grenade dans CS2 (cs2_practice.cfg la lie à K) : le chrono part quand tu l'appuies. Vide = désactivé
RethrowKey=k
; 1 = note les événements du chrono dans data\timer_debug.txt (dépannage)
TimerDebug=0
; Style des fenêtres du menu (réglé dans « Réglages du menu », onglet Fenêtres) : dark, light ou menu (comme l'overlay en jeu)
WinTheme=dark
; Couleur d'accent des onglets (6 caractères hexadécimaux)
WinAccent=5B9BFF
; Police des fenêtres
WinFont=Segoe UI
; Taille du texte des fenêtres en % (90 à 120)
WinScale=100
; Chronomètre de grenade : temps entre le lâcher et l'explosion (lu dans console.log, activé dans « Réglages du menu », onglet Chrono)
TimerOn=1
; 1 = juste à droite des coordonnées, 0 = position libre (TimerX, TimerY)
TimerAuto=1
TimerX=12
TimerY=820
; Secondes pendant lesquelles le résultat reste affiché (2 à 20)
TimerDur=6
; 1 = propose de mesurer le temps de vol après la création d'un stuff de grenade, 0 = ne jamais proposer
FlightAsk=1
; Taille (en Mo) de console.log au-delà de laquelle il est vidé au lancement du menu, quand CS2 est fermé (0 = jamais)
LogMaxMB=10
; Exec automatique du cfg d'entraînement (à l'ouverture du menu, une fois par map détectée, envoyé par la connexion directe)
AutoExec=1
PracticeCfg=cs2_practice
; 1 = le menu se ferme après chaque stuff, 0 = il reste ouvert
CloseAfterRun=1
; 1 = détecte la map en cours à l'ouverture du menu (nécessite -condebug)
AutoDetectMap=1
; Laisser vide = auto (dossier game\csgo\console.log)
ConsoleLog=

[Overlay]
; Modifié automatiquement par la fenêtre de réglages (entrée « Réglages du menu »)
Font=
Scale=100
X=30
Y=100
Opacity=225
Bg=14181D
; Thème de couleurs (vide = couleurs automatiques) : graphite, encre, foret, bordeaux, ardoise, papier
Theme=
; Coins arrondis du menu : rayon en pixels (0 = coins carrés)
Corner=14
; Épaisseur du liseré coloré autour du menu en pixels (0 = aucun)
Border=2
; Couleur du liseré en hexadécimal (ex : E3C48A), vide = automatique selon le thème
BorderColor=
; Titre affiché en haut du menu (laisser vide pour le masquer). {version} est remplacé par la version du script.
Title=Menu Stuf V.{version} ProToxEU

[State]
LastMap=
