; Copié automatiquement en config.ini au premier lancement (config.ini n'est pas versionné).
; Adapte CfgPath à ton installation de CS2.

[Settings]
; Fichier que le script écrit pour envoyer les commandes à CS2 (dossier cfg du jeu)
CfgPath=C:\Program Files (x86)\Steam\steamapps\common\Counter-Strike Global Offensive\game\csgo\cfg\stuff_run.cfg
; Touches (syntaxe AutoHotkey : F7, F8, XButton1, ...)
ToggleKey=F7
RepeatKey=F8
SaveKey=F9
FavKey=F2
DelKey=F3
AddKey=F4
; Cadenas : verrouille/déverrouille la catégorie ou le stuff sélectionné (empêche la suppression)
LockKey=F5
; Fenêtre de gestion : déplacer, renommer et supprimer des stuffs et des catégories
ManageKey=F11
; Profils et partage de stuffs (export / import)
ShareKey=F1
; 1 = vérifie au lancement s'il existe une nouvelle version sur GitHub (propose de l'installer), 0 = désactivé
AutoUpdate=1
; Décalage de hauteur appliqué à chaque téléportation (setpos). getpos renvoie la hauteur
; des yeux, setpos place les pieds : -64 évite d'apparaître trop haut / dans le plafond.
; Mets 0 pour désactiver, ou ajuste (ex. -60) si tu es encore trop haut ou trop bas.
TpZOffset=-64
; Coordonnées en temps réel dans le coin inférieur gauche (touche pour afficher/masquer)
HudKey=Insert
; Fréquence de mise à jour en millisecondes (minimum 100)
HudInterval=300
; 1 = afficher les coordonnées dès le lancement du script
HudAtStart=0
; Réglages de l'apparence du menu (couleur, police, taille, position)
SettingsKey=F10
; Exec automatique du cfg d'entraînement (à l'ouverture du menu, une fois par map détectée)
AutoExec=1
PracticeCfg=cs2_practice
; Touche pour relancer l'exec à la demande
ExecKey=F6
; Optionnel : touche de la console, pour que le script tape l'exec lui-même.
; Exemple : {sc029} = touche à gauche du 1 (² sur AZERTY, ` sur QWERTY).
; Vide = l'exec passe par la touche liée (lance "exec cs2_practice" une fois à la main).
ConsoleKey=
; 1 = le menu se ferme après chaque stuff, 0 = il reste ouvert
CloseAfterRun=1
; 1 = détecte la map en cours à l'ouverture du menu (nécessite -condebug)
AutoDetectMap=1
; Laisser vide = auto (dossier game\csgo\console.log)
ConsoleLog=

[Overlay]
; Modifié automatiquement par la fenêtre de réglages (touche F10)
Font=
Scale=100
X=30
Y=100
Opacity=225
Bg=14181D
; Titre affiché en haut du menu (laisser vide pour le masquer)
Title=Menu Stuf V.2 ProToxEU

[State]
LastMap=
